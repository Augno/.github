name: Feature request
description: Suggest a capability or a change to how something works.
labels: ['enhancement']
body:
    - type: markdown
      attributes:
          value: |
              For anything large — a new endpoint, a schema change, a refactor spanning several
              packages — this issue is the right first step. We would rather discuss a design than
              decline a finished branch.

    - type: textarea
      id: problem
      attributes:
          label: What problem are you trying to solve?
          description: Describe the situation you are in, not the solution you have in mind.
      validations:
          required: true

    - type: textarea
      id: proposal
      attributes:
          label: What would you like to see?
          description: If you have an API shape or an interface in mind, sketch it here.
      validations:
          required: true

    - type: textarea
      id: alternatives
      attributes:
          label: What have you tried instead?
          description: Workarounds you are using today, and why they fall short.
      validations:
          required: false
